worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  server_tokens off;

  log_format main '$remote_addr - $remote_user [$time_local] '
                  '"$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" '
                  '$request_time';
  access_log /var/log/nginx/access.log main;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types
    text/plain text/css text/xml
    application/json application/javascript application/xml application/rss+xml
    image/svg+xml font/woff font/woff2;

  proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=next_cache:50m max_size=500m inactive=60m use_temp_path=off;

  # CV / image uploads — 25 MB envelope is generous; storage layer caps below.
  client_max_body_size 25M;

  upstream nextjs_upstream {
    server app:3000;
    keepalive 32;
  }

  # ──────────────────────────────────────────────────────────────────────
  # Port 80 — Let's Encrypt challenge + redirect everything else to HTTPS.
  # ──────────────────────────────────────────────────────────────────────
  server {
    listen 80 default_server;
    server_name _;

    # Webroot challenge — certbot writes proof files here, nginx serves them.
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
      default_type "text/plain";
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ──────────────────────────────────────────────────────────────────────
  # Port 443 — the actual site. Cert path is rendered by envsubst at boot
  # from the SERVER_NAME env var (see docker-compose.prod.yml).
  # ──────────────────────────────────────────────────────────────────────
  server {
    listen 443 ssl;
    http2 on;
    server_name ${SERVER_NAME} www.${SERVER_NAME};

    ssl_certificate     /etc/letsencrypt/live/${SERVER_NAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${SERVER_NAME}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE+AESGCM:ECDHE+CHACHA20:DHE+AESGCM:DHE+CHACHA20;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Long-lived cache for hashed Next.js bundles.
    location /_next/static/ {
      proxy_pass http://nextjs_upstream;
      proxy_cache next_cache;
      proxy_cache_valid 200 365d;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Optimized images from next/image.
    location /_next/image {
      proxy_pass http://nextjs_upstream;
      proxy_cache next_cache;
      proxy_cache_valid 200 1d;
      add_header Cache-Control "public, max-age=86400";
    }

    # Static assets bundled into /public.
    location /assets/ {
      proxy_pass http://nextjs_upstream;
      proxy_cache next_cache;
      proxy_cache_valid 200 7d;
      add_header Cache-Control "public, max-age=604800";
    }

    # Default route — proxy to Next.js.
    location / {
      proxy_pass http://nextjs_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
      proxy_read_timeout 60s;
    }
  }
}
