# Compose dùng cho Dokploy "Compose" service type.
#
# Khác với docker-compose.prod.yml (self-host manual):
#   - Không có nginx service — Dokploy provide Traefik làm reverse proxy
#   - Không có certbot service — Traefik tự xin + renew Let's Encrypt
#   - App + Postgres không expose port ra host — chỉ giao tiếp trên
#     `dokploy-network` (external, do Dokploy tạo sẵn)
#   - Routing + SSL khai báo qua Traefik labels trên service `app`
#
# Trong Dokploy:
#   Build Path     → /
#   Compose Path   → ./docker-compose.dokploy.yml
#   Mọi biến ${VAR} ở dưới đều lấy từ tab "Environment" của Compose service.

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-longanh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-longanh}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - dokploy-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-longanh}']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network

      # HTTPS router — apex + www gộp vào 1 rule.
      - traefik.http.routers.longanh-app.rule=Host(`${SERVER_NAME}`) || Host(`www.${SERVER_NAME}`)
      - traefik.http.routers.longanh-app.entrypoints=websecure
      - traefik.http.routers.longanh-app.tls=true
      - traefik.http.routers.longanh-app.tls.certresolver=letsencrypt

      # HTTP -> HTTPS redirect.
      - traefik.http.routers.longanh-app-http.rule=Host(`${SERVER_NAME}`) || Host(`www.${SERVER_NAME}`)
      - traefik.http.routers.longanh-app-http.entrypoints=web
      - traefik.http.routers.longanh-app-http.middlewares=longanh-redirect
      - traefik.http.middlewares.longanh-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.longanh-redirect.redirectscheme.permanent=true

      # Upstream port của container (next.js standalone listen :3000).
      - traefik.http.services.longanh-app.loadbalancer.server.port=3000

networks:
  dokploy-network:
    external: true

volumes:
  postgres_data:
